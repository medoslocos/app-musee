# Configuration de la veille crypto — copier en config.yaml et ajuster.
# Les secrets (Telegram) vont dans .env, PAS ici.
# Toutes les valeurs ci-dessous sont surchargeables ; les seuils marqués
# « à définir » dans le brief ont ici des valeurs de départ raisonnables.

intervalle_heures: 3.5          # brief : push toutes les 3-4h
max_alertes_par_cycle: 15
db_path: veille.db

# --- Filtres anti-rug minimum (V1) -----------------------------------
filtres:
  liquidite_min_usd: 10000      # évite les tokens illiquides invendables
  age_min_heures: 1             # évite le scan à la seconde zéro (scams flash)
  age_max_heures: 336           # 14 j : au-delà ce n'est plus une "nouveauté"
  top10_holders_max_pct: 40     # concentration holders max
  exiger_lp_lock: true
  exiger_mint_renonce: true
  # Indulgent en V1 : DexScreener seul ne fournit pas LP lock / mint /
  # concentration. Passer à true dès qu'une source sécurité (Birdeye) est
  # branchée pour rejeter par prudence quand la donnée manque.
  rejeter_si_inconnu: false

# --- Scoring (0-10) ---------------------------------------------------
scoring:
  poids_velocite_volume: 3.0
  poids_croissance_liquidite: 2.0
  poids_croissance_holders: 2.0
  poids_ratio_liq_mcap: 2.0
  poids_momentum_prix: 1.0
  bonus_personnalite: 1.5       # ATTENTION accrue, PAS sécurité (voir README)
  seuil_alerte: 6.0             # seuls les tokens au-dessus déclenchent une alerte
  plancher_couverture: 0.4      # amortit les scores basés sur trop peu de signaux

# --- Sources ----------------------------------------------------------
sources:
  dexscreener_activer: true
  geckoterminal_activer: true
  chaines:
    - solana
  requetes_recherche:           # amorce du scan DexScreener
    - SOL
    - pepe
    - cat
    - dog
    - wif
    - moon
  timeout_s: 15
  delai_requete_s: 1.0          # politesse envers les API gratuites

# --- Brique news / personnalités -------------------------------------
news:
  activer: true
  fenetre_news_heures: 48
  flux_rss:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
    - https://www.theblock.co/rss.xml
  personnalites:                # watchlist à enrichir
    - trump
    - musk
    - elon
    - ronaldo
    - messi
    - kardashian

# --- Telegram (dry_run ici ; secrets dans .env) ----------------------
telegram:
  dry_run: true
